name: Build D2RLaunch-WPF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Find project files
        shell: pwsh
        run: Get-ChildItem -Recurse -Include *.sln,*.csproj

      - name: Build
        shell: pwsh
        run: dotnet build "RUTA_DEL_PROYECTO.csproj" -c Release
